<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.2.0/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" /> -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" integrity="sha512-1ycn6IcaQQ40/MKBW2W4Rhis/DbILU74C1vSrLJxCq57o941Ym01SwNsOMqvEBFlcgUa6xLiPY/NS5R+E6ztJQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <title>Intro JS</title>
</head>
<body>
  <div class="text-center" id="root">
    <!-- Comentario -->
    <div class="container mt-3 d-flex justify-content-end">
      <h1 class="text-primary">Hola Mundo</h1>
      <button onclick="myFunction()" class="btn btn-primary ms-5">Ejecutar</button>
    </div>
    <hr>

    <!-- Login -->
    <div class="container mt-2 d-flex justify-content-end">
      <p id="welcome">No hay nadie logeado</p>
      <button id="btnLogin" onclick="loginLogout()" class="btn btn-danger ms-5">
        Login
      </button>
    </div>
    <hr>

    <!-- Ingrese password -->
    <div class="container my-5">
      <div class="input-group flex-nowrap">
        <input id="inputPassword" type="password" class="form-control" placeholder="ingrese password">
        <span id="spanPassword" onclick="changeView()" class="input-group-text">
          <i class="fas fa-eye text-success"></i>

        </span>
      </div>
    </div>


    <!-- Dahboard del usario-->
    <div id="dashboard" class="container mt-5 d-none">
      <hr>
      <h1 class="text-success">Dashboard</h1>
      <ul class="list-group">
        <li class="list-group-item">Item 1 </li>
        <li class="list-group-item">Item 2 </li>
        <li class="list-group-item">Item 3</li>
      </ul>
    </div>


  </div>
  <script src="index.js"></script>
</body>
</html>
