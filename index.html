<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <!-- Fontawesome -->
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" integrity="sha512-1ycn6IcaQQ40/MKBW2W4Rhis/DbILU74C1vSrLJxCq57o941Ym01SwNsOMqvEBFlcgUa6xLiPY/NS5R+E6ztJQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css"> -->
</head>

<body>
  <div class="container mt-5">
  <h1 class="text-center text-primary mt-2">Event Handlers</h1>
  <div class="container">
    <div class="row d-flex justify-content-center">
      <div class="col-10 col-sm-8 col-md-7 col-lg-4">
        <form onsubmit="handleSubmit()">
          <div class="form mb-3">
            <label for="inputEmail">Email address</label>
            <div class="input-group">
              <input id="inputEmail" type="email" class="form-control" placeholder="name@domain.com">
            </div>
          </div>
          <div class="form">
            <label for="inputPassword">Password</label>
            <div class="input-group">
              <input id="inputPassword" type="password" class="form-control" placeholder="password">
              <div id="view" onclick="handleView()" class="input-group-text text-light bg-success">
                <i class="fas fa-eye"></i>
              </div>
            </div>
          </div>
          <div class="mt-4">
            <button type="submit" class="btn btn-warning">Ingresar</button>
            <button type="button" onclick="handleRegister({name: 'Roberto', cohorte: 'Spain123'})" class="btn btn-outline-success">Registrarme</button>
            <button type="reset" class="btn btn-outline-danger">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>  

  <script src="./index.js"></script>  </div>


  <!-- Boostrap -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
    integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
    crossorigin="anonymous"></script>
</body>

</html>
